<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greenly</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <button id="sidebar-toggle" class="icon-button" aria-label="Sohbet Geçmişini Aç/Kapat">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <div class="logo">🌿 Greenly</div>
    </header>

    <div class="layout-container">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-content">
                <button id="new-chat-btn" class="new-chat-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Yeni Sohbet
                </button>
                <h2>Sohbet Geçmişi</h2>
                <ul id="history-list">
                    <li class="history-item active">Bugün</li>
                </ul>
            </div>
        </aside>

        <main>

            <section id="welcome-screen">
                <h1 id="greeting">Merhaba! Ben Greenly</h1>
                <p>Bitkilerle ilgili nasıl yardımcı olabilirim?</p>
            </section>

            <div id="chat-box"></div>

            <div class="input-container">

                <input id="user-input" type="text" placeholder="Bitkin hakkında bir şey sor..." autocomplete="off">

                <button id="send-button" aria-label="Send message">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="6 11 12 5 18 11"></polyline>
                    </svg>
                </button>

            </div>

        </main>
    </div>

    <script src="script.js"></script>

</body>

</html>
